name: Scheduled cron jobs

# Reliable external scheduler for the /api/cron/* routes.
#
# Replaces the Cloudflare Worker `scheduled()` triggers, which fire inconsistently
# on this OpenNext setup (the handler is invoked, but the in-process fetch to the
# route doesn't reliably run the job). These routes work over plain HTTPS with the
# CRON_SECRET bearer token — proven by manual invocation — so an external scheduler
# is the dependable path. GitHub Actions cron is UTC and best-effort (may run a few
# minutes late), which is fine for these daily maintenance jobs.
on:
  schedule:
    - cron: "0 6 * * *" # daily — fans out to its child jobs internally
    - cron: "0 3 * * 0" # check-live-urls (Sunday) — GH accepts 0 for Sunday
    - cron: "0 4 * * *" # quality-rescore
    - cron: "30 5 * * *" # verify-backfill
    - cron: "0 15 * * 1,2" # weekly-digest (Mon + Tue)
    - cron: "30 7 * * *" # bags-sync — after the 06:00 daily fan-out has settled
    - cron: "0 2,8,14,20 * * *" # bags-discover — every 6h: the feed holds only
      # the 100 most recent launches and does not paginate, so a daily run would
      # miss everything beyond the last 100 whenever Bags is busy. Hours are
      # written out because a step expands only to the end of the field: the
      # "0 8/6 * * *" this replaces meant 08/14/20 and then a twelve-hour gap
      # overnight, so it had been running three times a day, not four.
  workflow_dispatch:
    inputs:
      route:
        description: "Cron route to run now (daily | check-live-urls | quality-rescore | verify-backfill | weekly-digest | bags-sync | bags-discover)"
        required: true
        type: choice
        options: [daily, check-live-urls, quality-rescore, verify-backfill, weekly-digest, bags-sync, bags-discover]
        default: "verify-backfill"

concurrency:
  group: cron-${{ github.event.schedule || github.event.inputs.route }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve route from schedule (or manual input)
        id: r
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ROUTE: ${{ github.event.inputs.route }}
        run: |
          case "$SCHEDULE" in
            "0 6 * * *")    ROUTE=daily ;;
            "0 3 * * 0")    ROUTE=check-live-urls ;;
            "0 4 * * *")    ROUTE=quality-rescore ;;
            "30 5 * * *")   ROUTE=verify-backfill ;;
            "0 15 * * 1,2") ROUTE=weekly-digest ;;
            "30 7 * * *")   ROUTE=bags-sync ;;
            "0 2,8,14,20 * * *") ROUTE=bags-discover ;;
            *)              ROUTE="$MANUAL_ROUTE" ;;
          esac
          case "$ROUTE" in
            daily|check-live-urls|quality-rescore|verify-backfill|weekly-digest|bags-sync|bags-discover) ;;
            *) echo "::error::Unknown cron route"; exit 1 ;;
          esac
          echo "route=$ROUTE" >> "$GITHUB_OUTPUT"

      - name: Run cron route
        env:
          ROUTE: ${{ steps.r.outputs.route }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "→ GET https://www.vibetalent.work/api/cron/$ROUTE"
          # Do not retry a whole mutating job: partial work may already be saved.
          TRANSPORT_EXIT=0
          CODE=$(curl -sS --connect-timeout 15 --max-time 600 -o /tmp/out -w "%{http_code}" \
            "https://www.vibetalent.work/api/cron/$ROUTE" \
            -H "Authorization: Bearer $CRON_SECRET") || TRANSPORT_EXIT=$?
          echo "HTTP $CODE (curl exit $TRANSPORT_EXIT)"
          if [ -f /tmp/out ]; then head -c 4000 /tmp/out; echo; fi
          [ "$TRANSPORT_EXIT" = "0" ] || { echo "::error::cron $ROUTE transport failed (curl $TRANSPORT_EXIT)"; exit 1; }
          [ "$CODE" = "200" ] || { echo "::error::cron $ROUTE returned HTTP $CODE"; exit 1; }
          jq -e 'type == "object" and (.error | not) and ((.errors // 0) == 0) and ((.failed_jobs // []) | length == 0)' /tmp/out > /dev/null || {
            echo "::error::cron $ROUTE reported partial failure or an invalid response"
            exit 1
          }
